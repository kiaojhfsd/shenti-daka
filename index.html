<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#2F5D62" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="身材打卡" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<title>身材管理打卡 · 12 周</title>
<style>
:root{
  --teal:#2F5D62; --teal-d:#22464A; --teal-l:#E9F1F0; --teal-m:#9CC0BE;
  --accent:#E8933C; --ok:#37855A; --ok-l:#DFF3E5; --warm:#FDF3E7;
  --ink:#1C2A2B; --sub:#6C7B7C; --line:#DCE6E5; --bg:#F4F8F7; --card:#fff;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
#app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* ── 顶部 ── */
header{background:linear-gradient(160deg,#356B70,#22464A);color:#fff;padding:calc(var(--safe-t) + 14px) 16px 14px;position:sticky;top:0;z-index:20}
.hd-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hd-title{font-size:17px;font-weight:700;letter-spacing:.3px}
.hd-date{font-size:13px;opacity:.82;font-variant-numeric:tabular-nums}
.hd-sub{margin-top:3px;font-size:12.5px;opacity:.8}
.bar{margin-top:11px;height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#8FD3C7,#F2A65A);border-radius:99px;transition:width .35s ease}

/* ── 主体 ── */
main{flex:1;padding:14px 14px calc(96px + var(--safe-b))}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.sec-title{font-size:12.5px;font-weight:700;color:var(--teal);letter-spacing:.4px;margin:18px 4px 8px}
.sec-title:first-child{margin-top:4px}
.muted{color:var(--sub);font-size:13px}
.tiny{font-size:12px;color:var(--sub)}
h1{font-size:20px;line-height:1.35;margin:6px 0 6px}
h2{font-size:15px;margin:0 0 8px}

/* ── 今日 ── */
.hero{background:linear-gradient(155deg,#FFFFFF,#F3F8F7);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:var(--teal-l)}
.hero > *{position:relative;z-index:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--teal-l);color:var(--teal-d)}
.chip.warm{background:var(--warm);color:#9A5B12}
.chip.ok{background:var(--ok-l);color:var(--ok)}

.nav-days{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav-days button{border:1px solid var(--line);background:#fff;color:var(--teal);width:38px;height:38px;border-radius:12px;font-size:17px;line-height:1}
.nav-days .lbl{font-size:13.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.nav-days .lbl b{color:var(--ink)}

.grid2{display:flex;gap:10px;flex-wrap:wrap}
.chk{flex:1 1 calc(50% - 5px);min-height:76px;border-radius:15px;border:1.5px solid var(--line);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 6px;transition:.15s;font-family:inherit}
.chk .ic{font-size:21px;line-height:1}
.chk .nm{font-size:13px;font-weight:600;color:var(--ink)}
.chk .st{font-size:11px;color:var(--sub)}
.chk.on{border-color:var(--ok);background:var(--ok-l)}
.chk.on .nm{color:var(--ok)}
.chk.on .st{color:var(--ok)}
.chk:active{transform:scale(.97)}

.exbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:#F7FAFA;color:var(--teal-d);font-family:inherit;
  font-size:12px;font-weight:600;padding:6px 10px;border-radius:9px;line-height:1.2}
.mini:active{opacity:.75}
.mini.solid{background:var(--teal);color:#fff;border-color:var(--teal)}
.mini.act{background:var(--teal-l);border-color:var(--teal-m)}
.tips{display:none;margin-top:9px;background:#F7FAFA;border:1px solid var(--line);
  border-radius:11px;padding:10px;font-size:12.5px;color:#33474A}
.tips.on{display:block}
.tips .row{margin-bottom:6px;display:flex;gap:7px}
.tips .row:last-child{margin-bottom:0}
.tips .row i{font-style:normal;flex:none;font-weight:700;color:var(--teal);width:44px}
.tips .row.warn i{color:#B4463C}
.warm{display:flex;flex-wrap:wrap;gap:6px}
.warm .wchip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:12px}
.daymoves{display:none;margin-top:2px}
.daymoves.on{display:block}

.field{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.field label{font-size:13.5px;color:var(--sub);width:74px;flex:none}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal-m);box-shadow:0 0 0 3px rgba(47,93,98,.08)}
textarea{resize:vertical;min-height:62px}
.unit{font-size:13px;color:var(--sub);flex:none}
.btn{border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;font-family:inherit;
  background:var(--teal);color:#fff}
.btn.ghost{background:var(--teal-l);color:var(--teal-d)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:#FDECEC;color:#B4463C}
.btn:active{opacity:.85}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.ring-row{display:flex;align-items:center;gap:14px}
.ring{width:74px;height:74px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:var(--teal)}

/* ── 表格 ── */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600;background:#F7FAFA}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.tbl-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}

/* ── 训练动作 ── */
.ex{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:none}
.tick{width:24px;height:24px;flex:none;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px}
.tick.on{background:var(--ok);border-color:var(--ok)}
.ex .nm{font-size:14px;font-weight:600}
.ex .mt{font-size:12.5px;color:var(--sub);margin-top:1px}
.daycard.locked{opacity:.97}
.daycard.today{border-color:var(--teal-m);box-shadow:0 0 0 3px rgba(47,93,98,.07)}

/* ── 数据 ── */
.kpis{display:flex;gap:10px}
.kpi{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 10px;text-align:center}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11.5px;color:var(--sub);margin-top:2px}
canvas{width:100%;height:186px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px;padding-left:2px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* ── 底部导航 ── */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .inner{max-width:540px;margin:0 auto;display:flex}
nav button{flex:1;border:none;background:none;padding:8px 0 9px;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub)}
nav button .ic{font-size:19px;line-height:1.1}
nav button .tx{font-size:10.5px;font-weight:600}
nav button.on{color:var(--teal)}
nav button.on .ic{transform:translateY(-1px)}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,12px);
  background:rgba(28,42,43,.93);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:99px;
  opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:26px 10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-row">
      <span class="hd-title" id="hdTitle">身材管理打卡</span>
      <span class="hd-date" id="hdDate"></span>
    </div>
    <div class="hd-sub" id="hdSub"></div>
    <div class="bar"><i id="hdBar" style="width:0%"></i></div>
  </header>

  <main>
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-train"></section>
    <section class="view" id="v-diet"></section>
    <section class="view" id="v-data"></section>
    <section class="view" id="v-set"></section>
  </main>

  <nav>
    <div class="inner">
      <button data-go="today" class="on"><span class="ic">✅</span><span class="tx">今日</span></button>
      <button data-go="train"><span class="ic">🏋️</span><span class="tx">训练</span></button>
      <button data-go="diet"><span class="ic">🍚</span><span class="tx">饮食</span></button>
      <button data-go="data"><span class="ic">📈</span><span class="tx">数据</span></button>
      <button data-go="set"><span class="ic">⚙️</span><span class="tx">设置</span></button>
    </div>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>

    ["坐姿哑铃肩推","3 × 10","60 秒","弹力带过头推举"],

    ["腿举 / 高脚杯深蹲","3 × 12","60 秒","后撤箭步蹲 3 × 12 / 腿"],

    ["髋外展（器械或弹力带）","3 × 15","45 秒","弹力带侧向走 3 × 15 步"],

    ["坐姿划船","3 × 10–12","60 秒","弹力带划船 3 × 15"],
    ["单臂哑铃划船","3 × 10 / 侧","60 秒","弹力带单臂划船"],
    ["面拉 / 反向飞鸟","3 × 15","45 秒","弹力带面拉 3 × 15"],
    ["哑铃弯举","3 × 12","45 秒","弹力带弯举 3 × 15"],
    ["农夫行走","3 × 30 秒","45 秒","拎两瓶矿泉水走"]
  ]}
};

/* 周一=1 … 周日=0 */
const DOW_TASK = {1:"A",2:"B",3:"CARDIO",4:"C",5:"CARDIO",6:"D",0:"REST"};
const TASK_TEXT = {
  A:"力量A：下肢（深蹲主导）+ 核心",
  B:"力量B：上肢推（胸 / 肩 / 三头）",
  C:"力量C：下肢（髋 / 臀）+ 核心",
  D:"力量D：上肢拉（背 / 二头）",
  CARDIO:"快走 30–40 分钟",
  REST:"休息 + 备餐 1 小时"
};
const TASK_HINT = {
  A:"先热身 8 分钟，大动作组间休息 90 秒，练完拉伸 5 分钟。",
  B:"推类动作保持肩胛稳定，侧平举用小重量控制。",
  C:"硬拉注意背部平直，先想“把地面推开”。",
  D:"拉类动作先沉肩再拉，顶峰停 1 秒。",
  CARDIO:"心率约 120–140，能说话但不能唱歌；当天步数也记着凑够 8000。",
  REST:"完全休息，顺手备餐：杂粮饭、鸡胸、鸡蛋、洗好蔬菜。"
};
const WD = ["周日","周一","周二","周三","周四","周五","周六"];
const PHASES = [
  {i:0, to:2,  p:120, f:55, c:181, name:"第 1–2 周 · 适应期",   tip:"先把习惯建立起来，热量不用压太狠。"},
  {i:1, to:8,  p:120, f:50, c:165, name:"第 3–8 周 · 主要减脂期", tip:"缺口约 450–500 kcal，每周减 0.4–0.6kg。"},
  {i:2, to:12, p:125, f:45, c:149, name:"第 9–12 周 · 冲刺期",   tip:"进度好就维持 1600，不必强求降到 1550。"}
];
function phaseKcal(ph){ return S.set.phaseKcal[ph.i]; }
const MEALS = [
  ["早餐","400","30 g","起床后 1 小时内","全麦面包 2 片 + 鸡蛋 2 个 + 无糖豆浆 250ml"],
  ["加餐","150","15 g","上午 10 点 / 下午 3:30","无糖酸奶 150g + 坚果 10g"],
  ["午餐","500","35 g","12:00–13:00","杂粮饭 1 拳 + 鸡胸或瘦牛肉 150g + 蔬菜 2 拳 + 油 1 勺"],
  ["晚餐","550","40 g","练完 1 小时内 / 20:00 前","红薯或玉米 1 拳 + 鱼虾豆腐 150–200g + 蔬菜 2 拳 + 油 1 勺"]
];
const EXCHANGE = [
  ["蛋白（每份 ≈ 20g）","鸡胸 100g ｜ 鸡蛋 3 个 ｜ 瘦牛肉 100g ｜ 虾 120g ｜ 豆腐 200g ｜ 无糖酸奶 250g ｜ 乳清蛋白 1 勺"],
  ["主食（每份 ≈ 20g 碳水）","米饭半碗 ｜ 杂粮饭半碗 ｜ 红薯 100g ｜ 玉米 1 根 ｜ 全麦面包 1 片 ｜ 燕麦 25g"],
  ["蔬菜（每餐 2 拳）","绿叶菜、西兰花、番茄、黄瓜、菌菇、白萝卜 —— 基本不限量"],
  ["脂肪（每份 ≈ 100 kcal）","橄榄油 1 勺 ｜ 坚果 10g ｜ 牛油果 1/4 个 ｜ 芝麻酱 1 小勺"]
];
const CHECKS = [
  ["train","🏋️","训练","按计划练完"],
  ["steps","🚶","步数","≥ 8000 步"],
  ["diet","🍚","饮食","热量达标"],
  ["sleep","😴","睡眠","≥ 7 小时"]
];

/* ── 动作要点：起 / 做 / 错 ── */
const TIPS = {
  "高脚杯深蹲（哑铃 / 壶铃）":["双脚与肩同宽，脚尖略朝外，双手把哑铃抱在胸前，挺胸。",
    "屈髋屈膝一起下蹲，膝盖顺着脚尖方向打开，蹲到大腿接近平行，再脚掌踩实站起。",
    "膝盖内扣、弓腰、脚跟离地。蹲不下去就先蹲到一半，别硬压。"],
  "罗马尼亚硬拉":["双脚与髋同宽，杠铃（或哑铃）贴住大腿，肩胛微微收紧。",
    "臀部往后推，上身像鞠躬一样前倾，杠铃贴着腿往下滑到小腿中部，感觉大腿后侧被拉紧，再夹臀站起。",
    "弓背、用腰去拽、把杠铃往前甩。全程杠铃贴着身体走。"],
  "保加利亚分腿蹲":["后脚脚背搭在凳子或沙发上，前脚往前站一步，重心在前脚。",

  "臀桥 / 髋推":["上背靠在凳子边缘，双脚踩实与肩同宽，重物放在髋部（垫条毛巾）。",
    "脚跟发力把髋顶起来，顶端用力夹紧屁股停 1 秒，再慢慢放下。",
    "用腰去顶、下巴抬高看天花板。眼神看膝盖方向，力量来自臀部。"],
  "站姿提踵":["前脚掌踩在台阶边缘，脚跟悬空，扶墙保持平衡。",
    "用小腿把身体顶到最高，停 1 秒，再用 3 秒慢慢放下到脚跟低于台阶。",
    "上下弹震、速度太快。慢放比快起更重要。"],
  "死虫式":["仰卧，双手指向天花板，双腿屈膝 90 度抬起，腰背贴住地面。",
    "呼气时对侧的手和脚同时缓慢伸出，快贴地时收回，再换另一边。",

/* 唤起失败时，让浏览器回到本页面并带上标记，
   这样能明确告诉用户「没打开成功」，而不是把他甩到下载页 */
/* Keep 官方唤起方式：
   ① App 自有协议  keep://<app 内部路由>
   ② 官方中转页  https://show.gotokeep.com/openapp?schema=<上面那个>
   中转页会自动尝试拉起 App，失败时给出「打开 Keep」「下载 Keep」两个按钮。 */
function keepOpenUrl(route){
  const schema = "keep://" + String(route||"").replace(/^\/+/,"");
  return "https://show.gotokeep.com/openapp?schema=" + encodeURIComponent(schema);
}
/* 把用户从 Keep 复制来的分享链接，转成 App 内部路由
   https://m.gotokeep.com/training/albums?id=xxx&utm_... → training/albums?id=xxx */
function keepRouteFromLink(url){
  const m = String(url).match(/gotokeep\.com\/([^?#]*)(\?[^#]*)?/);
  if(!m) return null;
  const path = m[1].replace(/^\/+|\/+$/g,"");
  if(!path) return null;
  const idm = (m[2]||"").match(/[?&]id=([^&#]+)/);
  return path + (idm ? "?id=" + idm[1] : "");
}
const KEEP_FAILED = /[?&]keepfail=1/.test(location.search);

/* 「高脚杯深蹲（哑铃 / 壶铃）」→「高脚杯深蹲」 */
function keepKey(name){
  return String(name).split("（")[0].split(" / ")[0].trim();
}

const KEY = "shenti.v1";
const DEFAULT_SET = {

  waistStart:80, phaseKcal:[1700,1600,1550], weeks:12,
  links:{}, autoOpenKeep:true
};
let S = {set:Object.assign({},DEFAULT_SET), days:{}, weeks:{}};

function todayISO(){ return iso(new Date()); }
function iso(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+dd;
}
function parseISO(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function r1(n){ return Math.round(n*10)/10; }
function fmtMD(s){ const d=parseISO(s); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      S.set = Object.assign({},DEFAULT_SET,o.set||{});
      if(!S.set.links) S.set.links = {};
      S.days = o.days||{};
      S.weeks = o.weeks||{};
    }
  }catch(e){ console.warn("读取失败",e); }
  if(!S.set.startDate) S.set.startDate = todayISO();
}
const storageOK = (function(){
  try{ localStorage.setItem("__probe__","1"); localStorage.removeItem("__probe__"); return true; }
  catch(e){ return false; }
})();
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast("保存失败，存储空间可能已满"); }
  },120);
}
function dayOf(ds){
  if(!S.days[ds]) S.days[ds] = {};
  return S.days[ds];
}
function weekOf(ds){ return Math.floor(diffDays(S.set.startDate, ds)/7)+1; }
function dayIdx(ds){ return diffDays(S.set.startDate, ds); }
function taskOf(ds){ return DOW_TASK[parseISO(ds).getDay()]; }
function phaseOf(week){ return PHASES.find(function(p){ return week<=p.to; }) || PHASES[PHASES.length-1]; }
function isDeload(week){ return week===6 || week===12; }

/* ══════════════ 小工具 ══════════════ */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
let toastTimer=null;
function toast(msg, ms){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, ms || 1800);
}
function $(sel,root){ return (root||document).querySelector(sel); }
function $$(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function on(root,sel,ev,fn){

}

  document.getElementById("hdDate").textContent = fmtMD(cursor);
  document.getElementById("hdTitle").textContent = "第 "+week+" 周 · "+WD[parseISO(cursor).getDay()];

function countDone(ds){
  const d = S.days[ds]; if(!d) return 0;
  return CHECKS.reduce(function(n,c){ return n + (d[c[0]]?1:0); },0);
}

function ring(done,total){
  const R=32, C=2*Math.PI*R, pct=Math.min(1,done/total);
  return '<div class="ring"><svg width="74" height="74" viewBox="0 0 74 74">'+
    '<circle cx="37" cy="37" r="'+R+'" fill="none" stroke="#E4EDEC" stroke-width="7"/>'+
    '<circle cx="37" cy="37" r="'+R+'" fill="none" stroke="#2F5D62" stroke-width="7" stroke-linecap="round" '+
    'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct)).toFixed(1)+'"/>'+
    '</svg><span class="val">'+done+'/'+total+'</span></div>';
}
function kpi(v,k){ return '<div class="kpi"><div class="v">'+v+'</div><div class="k">'+k+'</div></div>'; }
function lastWeightBefore(ds){
  let best=null;
  Object.keys(S.days).forEach(function(k){
    if(k<ds && S.days[k] && S.days[k].weight!=null){
      if(best===null || k>best) best=k;
    }
  });
  return best? S.days[best].weight : null;
}
/* 所有记录过的晨重，按日期排序，x = 相对开始日期的天数（可为负） */
function weightPoints(){
  const pts = [];
  Object.keys(S.days).forEach(function(k){
    const d = S.days[k];
    if(d && d.weight!=null && !isNaN(Number(d.weight)) && String(d.weight).trim()!==""){
      pts.push({x:diffDays(S.set.startDate,k), y:Number(d.weight), ds:k});
    }
  });
  pts.sort(function(a,b){ return a.x-b.x; });
  return pts;
}
function weekStats(week){
  const start = addDays(S.set.startDate,(week-1)*7);
  let ws=[], trainCnt=0, chkCnt=0;
  for(let i=0;i<7;i++){
    const ds = addDays(start,i), d = S.days[ds];
    if(!d) continue;
    if(d.weight!=null) ws.push(Number(d.weight));
    if(d.train) trainCnt++;
    chkCnt += countDone(ds);
  }
  const avg = ws.length? r1(ws.reduce(function(a,b){return a+b;},0)/ws.length) : null;
  return {avgWeight:avg, trainCnt:trainCnt, chkCnt:chkCnt, days:ws.length};
}

/* 复制到剪贴板：局域网 http 下没有 clipboard API，用老办法兜底 */
function legacyCopy(t){
  try{
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(function(){ return true; })
      .catch(function(){ return legacyCopy(t); });
  }
  return Promise.resolve(legacyCopy(t));
}
/* route 为空 = 只把 Keep 打开到首页 */
function launchKeep(route){
  if(S.set.autoOpenKeep === false) return false;
  try{
    location.href = keepOpenUrl(route || "");
    return true;
  }catch(e){ return false; }
}
/* 点「在 Keep 里找」：复制动作名 → 拉起 Keep → 粘贴搜索 */
function openVideo(name){
  const custom = S.set.links && S.set.links[name];
  if(custom){
    /* 存过 Keep 课程：直接跳进那节课 */
    const route = keepRouteFromLink(custom);
    if(route){ location.href = keepOpenUrl(route); }
    else { const w = window.open(custom, "_blank"); if(!w) location.href = custom; }
    return;
  }
  const q = keepKey(name);
  copyText(q).then(function(ok){
    if(!ok) toast("Keep 搜索词：「"+q+"」—— 手动输一下", 4000);
  });
  toast("已复制「"+q+"」，打开 Keep 粘贴搜索", 3200);
}
function setMyLink(name){
  const cur = (S.set.links && S.set.links[name]) || "";
  const v = prompt("把 Keep 里的课程链接粘贴到这里：\n\n"+
    "· Keep 里找到课程或课程合集 → 右上角分享 → 复制链接\n"+
    "· 形如 m.gotokeep.com/training/albums?id=...\n"+
    "· 留空 = 恢复成「在 Keep 里搜索」\n\n"+keepKey(name), cur);
  if(v===null) return;
  if(!S.set.links) S.set.links = {};
  if(v.trim()===""){ delete S.set.links[name]; toast("已恢复成在 Keep 里搜索"); }
  else { S.set.links[name] = v.trim(); toast("已存下这个 Keep 课程"); }
  save(); renderAll();
}

/* ══════════════ 视图：数据 ══════════════ */
function renderData(){
  const wpts = weightPoints();
  let allChk = 0, daysLogged = 0, streak = 0;
  Object.keys(S.days).forEach(function(k){
    const d = S.days[k];
    const c = countDone(k);
    if(c>0){ daysLogged++; allChk += c; }
  });
  /* 连续打卡（今天还没记就从昨天往前算） */
  let anchor = todayISO();
  if(!(S.days[anchor] && countDone(anchor)>0)) anchor = addDays(anchor,-1);
  for(let i=0;i<400;i++){
    const ds = addDays(anchor,-i);
    if(S.days[ds] && countDone(ds)>0) streak++; else break;
  }
  const cur = wpts.length? wpts[wpts.length-1].y : null;
  const delta = cur!=null? r1(cur - S.set.startWeight) : null;

  let html = "";
  html += '<div class="kpis">'+
    kpi(cur!=null?cur:"—","当前体重 (kg)")+
    kpi(delta!=null?((delta>0?"+":"")+delta):"—","相比起始")+
    kpi(streak+" 天","连续打卡")+
  '</div>';

  html += '<div class="sec-title">体重曲线</div><div class="card">'+
    '<canvas id="chart"></canvas>'+
    '<div class="legend"><span><i style="background:#2F5D62"></i>实际体重</span>'+
    '<span><i style="background:#E8933C"></i>参考进度（每周 −0.45kg）</span></div>'+
    (wpts.length<2?'<div class="empty">至少记录 2 天的晨重，曲线就会出来</div>':'')+
  '</div>';

  html += '<div class="sec-title">每周明细</div><div class="tbl-wrap"><table>'+
    '<tr><th class="n">周</th><th class="n">周平均</th><th class="n">变化</th><th class="n">腰围</th><th class="n">训练</th><th class="n">打卡</th></tr>';
  let prev = null;
  for(let w=1; w<=S.set.weeks; w++){
    const st = weekStats(w);
    const wk = S.weeks[w] || {};
    const d = (st.avgWeight!=null && prev!=null)? r1(st.avgWeight-prev) : null;
    if(st.avgWeight!=null) prev = st.avgWeight;
    const started = diffDays(S.set.startDate, todayISO()) >= (w-1)*7;
    html += '<tr'+(w===weekOf(cursor)?' style="background:#E9F1F0"':'')+'>'+
      '<td class="n">'+w+'</td>'+
      '<td class="n">'+(st.avgWeight!=null?st.avgWeight:"—")+'</td>'+
      '<td class="n" style="color:'+(d!=null&&d<0?"#37855A":"#6C7B7C")+'">'+(d!=null?(d>0?"+":"")+d:"—")+'</td>'+
      '<td class="n"><input type="number" step="0.1" inputmode="decimal" data-waist="'+w+'" value="'+
        (wk.waist!=null?wk.waist:"")+'" placeholder="'+(started?"":"—")+'" '+
        'style="width:58px;padding:4px 6px;text-align:center;font-size:13px"></td>'+
      '<td class="n">'+st.trainCnt+'/4</td>'+
      '<td class="n">'+st.chkCnt+'/28</td></tr>';
  }
  html += '</table></div>';
  html += '<div class="tiny" style="margin:8px 4px 0">周平均体重按「12周打卡表」里的晨重自动算；腰围每周量一次填进去。<br>'+
    '连续 2 周周平均没下降 → 每天少吃 100 kcal，或多走 2000 步（二选一）。一周掉超过 1kg → 加回 100–150 kcal。</div>';

  document.getElementById("v-data").innerHTML = html;

  on(document.getElementById("v-data"),"[data-waist]","input",function(){
    const w = Number(this.getAttribute("data-waist"));
    if(!S.weeks[w]) S.weeks[w] = {};
    const v = this.value.trim();
    if(v===""){ delete S.weeks[w].waist; } else { S.weeks[w].waist = Number(v); }
    save();
  });
  drawChart();
}

function drawChart(){
  const cv = document.getElementById("chart");
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 320, H = 186;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const pts = weightPoints();
  if(pts.length<2) return;

  const padL=34, padR=10, padT=12, padB=22;
  const pw = W-padL-padR, phh = H-padT-padB;
  const x0 = Math.min(0, pts[0].x);
  const x1 = Math.max(S.set.weeks*7-1, pts[pts.length-1].x);
  const ref = function(i){ return S.set.startWeight - 0.45*(i/7); };
  let lo = Math.min.apply(null, pts.map(function(p){return p.y;}));
  let hi = Math.max.apply(null, pts.map(function(p){return p.y;}));
  lo = Math.min(lo, ref(x0), ref(x1));
  hi = Math.max(hi, ref(x0), ref(x1));
  const sp = Math.max(0.6, hi-lo);
  lo -= sp*0.15; hi += sp*0.15;
  const X = function(i){ return padL + ((i-x0)/(x1-x0))*pw; };
  const Y = function(v){ return padT + (1-(v-lo)/(hi-lo))*phh; };

  /* 网格 + y 轴 */
  ctx.font = "10px -apple-system,sans-serif";
  ctx.fillStyle = "#8B9A9B"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for(let g=0; g<=3; g++){
    const v = lo + (hi-lo)*(g/3), y = Y(v);
    ctx.strokeStyle = "#EAF0EF"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(v.toFixed(1), padL-6, y);
  }
  /* x 轴：每 2 周标一次 */
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for(let w=1; w<=S.set.weeks; w+=2){
    const xi = (w-1)*7;
    if(xi < x0 || xi > x1) continue;
    const x = X(xi);
    ctx.fillText(w+"周", x, padT+phh+6);
  }
  /* 参考线 */
  ctx.save();
  ctx.setLineDash([5,4]); ctx.strokeStyle = "#E8933C"; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(let i=x0;i<=x1;i+=3){
    const x=X(i), y=Y(ref(i));
    if(i===x0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.restore();

  /* 实际曲线 */
  const grad = ctx.createLinearGradient(0,padT,0,padT+phh);
  grad.addColorStop(0,"rgba(47,93,98,.22)");
  grad.addColorStop(1,"rgba(47,93,98,0)");
  ctx.beginPath();
  pts.forEach(function(p,i){ const x=X(p.x), y=Y(p.y); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.lineTo(X(pts[pts.length-1].x), padT+phh);
  ctx.lineTo(X(pts[0].x), padT+phh);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  pts.forEach(function(p,i){ const x=X(p.x), y=Y(p.y); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.strokeStyle = "#2F5D62"; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.stroke();

  pts.forEach(function(p){
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 2.6, 0, 7);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.strokeStyle = "#2F5D62"; ctx.lineWidth = 1.8; ctx.stroke();
  });
  const lastP = pts[pts.length-1];
  ctx.beginPath(); ctx.arc(X(lastP.x), Y(lastP.y), 4.2, 0, 7);
  ctx.fillStyle = "#2F5D62"; ctx.fill();
}

  '</div>';

    '<div class="tiny" style="margin-top:6px">'+
    '· <b>在 Keep 里找</b> —— 自动复制动作名，并跳到 Keep，你在搜索框粘贴就能找到课程<br>'+
    '· <b>🔗 存课程</b> —— 在 Keep 里分享某节课或某个课程合集，把链接存下来；'+
    '之后点这个动作就是<b>直接跳进那节课</b></div>'+
    '<div class="tiny" style="margin-top:10px">'+
    (savedLinks.length ? '已经存了 <b>'+savedLinks.length+'</b> 个 Keep 课程链接。' :
      '还没存课程链接。建议第一次先把常用的 5–6 个动作存好，之后就省事了。')+
    '</div>'+

    '<div class="tiny" style="margin-top:6px">你这台手机上自动跳转没成功，如果嫌它碍事，就选第二个。</div>'+

    for(let i=0;i<S.set.weeks*7;i++){
      const ds = addDays(S.set.startDate,i), d = S.days[ds]||{};

      rows.push([weekOf(ds), ds, WD[parseISO(ds).getDay()], task,

        d.weight!=null?d.weight:"", (d.note||"").replace(/[\r\n,]/g," ")]);
    }
    const csv = "\ufeff"+rows.map(function(r){ return r.join(","); }).join("\r\n");
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "12周打卡表-"+todayISO()+".csv";

  document.getElementById("btnReset").addEventListener("click",function(){
    if(confirm("确定要清空全部记录吗？这个操作不能撤销。")){
      localStorage.removeItem(KEY);
      S = {set:Object.assign({},DEFAULT_SET,{startDate:todayISO()}), days:{}, weeks:{}};
      cursor = todayISO(); renderAll(); toast("已清空");
    }
  });
}

/* ══════════════ 路由与渲染 ══════════════ */
let view = "today";
let keepFail = KEEP_FAILED;
function renderAll(){
  renderHeader();
  if(view==="today") renderToday();
  else if(view==="train") renderTrain();
  else if(view==="diet") renderDiet();
  else if(view==="data") renderData();
  else renderSet();
}
function go(v){
  view = v;
  $$("nav button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-go")===v); });
  $$(".view").forEach(function(s){ s.classList.toggle("on", s.id==="v-"+v); });
  window.scrollTo(0,0);
  renderAll();
}
document.addEventListener("click",function(e){
  const b = e.target.closest("[data-go]");
  if(b){ go(b.getAttribute("data-go")); }
});
window.addEventListener("resize",function(){ if(view==="data") drawChart(); });

load();
cursor = todayISO();
if(keepFail){
  try{ history.replaceState(null,"",location.href.split("?")[0]); }catch(e){}
  go("train");
} else {
  renderAll();
}
})();
